<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kemist: check a medicine, find a pharmacy</title>
  <meta name="description" content="Check a medicine's NAFDAC registration and find pharmacies, clinics and hospitals near you in Nigeria.">
  <meta name="theme-color" content="#00844F">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Figtree:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Kemist home">
        <svg width="32" height="32" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#00844F"/><path fill="#fff" d="M192 96h128v96h96v128h-96v96H192v-96H96V192h96z"/><path d="M216 262l32 32 56-68" fill="none" stroke="#00844F" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Kemist
      </a>
      <div style="display:flex; align-items:center; gap:8px;">
        <span id="netPill" class="net-pill" hidden>Offline</span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <nav class="nav" aria-label="Main">
      <a href="#/" data-route="check">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
        Check
      </a>
      <a href="#/nearby" data-route="nearby">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        Nearby
      </a>
      <a href="#/report" data-route="report">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>
        Report
      </a>
      <a href="#/about" data-route="about">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
        About
      </a>
    </nav>

    <div class="content">
      <div id="demoBanner" class="demo-banner" hidden></div>
      <main id="view" tabindex="-1"></main>

      <section id="nearby" class="nearby" hidden aria-labelledby="nearbyTitle">
        <div class="nearby-head">
          <h1 id="nearbyTitle">Health services near you</h1>
          <div class="nearby-tools">
            <button id="locateBtn" class="btn primary" type="button">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
              Use my location
            </button>
            <button id="emergencyBtn" class="btn danger" type="button">Emergency</button>
          </div>
          <div class="chips" id="typeChips" role="group" aria-label="Filter by type"></div>
          <div class="chips" id="cityChips" role="group" aria-label="Or choose a city"></div>
          <div id="mapMsg" class="map-msg" role="status" hidden></div>
        </div>
        <div class="map-wrap">
          <div id="map" role="application" aria-label="Map of nearby health facilities"></div>
          <div class="map-overlay"><button id="areaBtn" class="btn small" type="button" hidden>Search this area</button></div>
        </div>
        <div id="facList" class="fac-list" aria-live="polite"></div>
      </section>
    </div>
  </div>

  <dialog id="emergencyDlg" aria-labelledby="emTitle"></dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
